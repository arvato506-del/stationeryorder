<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包裝物料倉儲管理系統</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0f1117; --card: #1a1d27; --border: #2a2e3a; --text: #e8eaed; --muted: #9aa0a6;
  --accent: #4f8cff; --accent2: #00c853; --warning: #ffb300; --danger: #ff5252; --radius: 12px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
header { background: linear-gradient(135deg, #1a1d27, #252836); padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
h1 { margin: 0; font-size: 1.3rem; font-weight: 700; } h1 span { color: var(--accent); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }
.tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
main { max-width: 1500px; margin: 0 auto; padding: 20px; }
.section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 12px; }
label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #12141c; color: var(--text); font-size: 1rem; }
input:focus, select:focus { outline: none; border-color: var(--accent); }
.btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
.btn:hover { opacity: 0.9; } .btn.secondary { background: #252836; border: 1px solid var(--border); color: var(--text); }
.btn.success { background: var(--accent2); color: #000; } .btn.warning { background: var(--warning); color: #000; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.sm { padding: 4px 10px; font-size: 0.8rem; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th { background: #252836; color: var(--text); padding: 8px; text-align: left; position: sticky; top: 0; }
td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
tr:hover { background: #1e2230; }
.status-Critical { color: var(--danger); font-weight: 700; } .status-Low { color: var(--warning); font-weight: 700; } .status-OK { color: var(--accent2); }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: #12141c; border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
.stat-card .num { font-size: 1.6rem; font-weight: 700; } .stat-card .label { font-size: 0.8rem; color: var(--muted); }
.stat-critical .num { color: var(--danger); } .stat-low .num { color: var(--warning); } .stat-ok .num { color: var(--accent2); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent2); color: #000; padding: 12px 24px; border-radius: 10px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
.toast.show { opacity: 1; } .empty { text-align: center; color: var(--muted); padding: 40px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.filters button { background: #252836; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
.filters button.active { background: var(--accent); border-color: var(--accent); }
.formula-box { background: #12141c; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; font-size: 0.9rem; }
.formula-box strong { color: var(--accent); }
.add-form { background: #1e2230; border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); display: none; }
.add-form.show { display: block; }
.batch-table input { width: 100px; padding: 6px; }
.cbm-result { font-size: 1.3rem; font-weight: 700; color: var(--accent); margin-top: 12px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.file-input { display: none; }
</style>
</head>
<body>
<header>
  <h1>包裝物料<span>倉儲</span>管理</h1>
  <div class="tabs">
    <button class="active" data-tab="dashboard">Dashboard</button>
    <button data-tab="materials">物料清單</button>
    <button data-tab="count">盤點記錄</button>
    <button data-tab="inbound">到倉記錄</button>
    <button data-tab="usage">用量計算</button>
    <button data-tab="cbm">CBM 計算</button>
    <button data-tab="order">下單</button>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span id="syncBadge" style="font-size:0.75rem;padding:2px 8px;border-radius:10px;background:#333;color:#888">未同步</span>
    <span id="loginStatus" style="font-size:0.85rem;color:var(--muted)">未登入</span>
    <button class="btn secondary sm" id="loginBtn">登入</button>
  </div>
</header>

<!-- Login Modal -->
<div id="loginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:320px;max-width:90%;">
    <h3 style="margin-top:0">管理員登入</h3>
    <label>密碼</label>
    <input type="password" id="loginPwd" placeholder="輸入密碼" style="margin-bottom:12px">
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn secondary" id="loginCancel">取消</button>
      <button class="btn" id="loginSubmit">登入</button>
    </div>
    <p style="font-size:0.75rem;color:var(--muted);margin-top:12px;margin-bottom:0">預設密碼：admin123</p>
  </div>
</div>

<main>
  <!-- Dashboard -->
  <div id="tab-dashboard">
    <div class="stat-grid" id="statGrid"></div>
    <div class="section">
      <h2 style="margin-top:0">庫存警示</h2>
      <div id="alertList"></div>
    </div>
    <div class="section">
      <h2 style="margin-top:0">資料管理</h2>
      <p style="color:var(--muted)">一鍵清空所有盤點與到倉記錄（物料主檔保留）。</p>
      <button class="btn danger" id="clearAllRecords">清空所有庫存紀錄</button>
    </div>
  </div>

  <!-- Materials -->
  <div id="tab-materials" style="display:none">
    <div class="section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
        <h2 style="margin:0">物料清單</h2>
        <div class="toolbar">
          <button class="btn secondary" id="toggleAddMat">＋ 新增物料</button>
          <button class="btn secondary" id="exportMatTemplate">下載物料範本 (XLSX)</button>
          <button class="btn secondary" id="importMatBtn">導入物料清單 (XLSX)</button>
          <input type="file" id="importMatFile" class="file-input" accept=".xlsx,.xls">
        </div>
      </div>
      <div class="add-form" id="addMatForm">
        <h3 style="margin-top:0">新增物料</h3>
        <div class="form-row">
          <div><label>物料#</label><input type="text" id="newId" placeholder="例如 BAG007"></div>
          <div><label>SAP#</label><input type="text" id="newSap"></div>
          <div><label>Description</label><input type="text" id="newName"></div>
          <div><label>單位</label><input type="text" id="newUm" placeholder="pcs / Roll / Pallet"></div>
          <div><label>供應商</label><input type="text" id="newSupplier" placeholder="例如 ChengDu"></div>
          <div><label>供應商 Email</label><input type="email" id="newEmail" placeholder="supplier@example.com"></div>
          <div><label>類型</label><select id="newType"><option>Carton Box</option><option>Bag</option><option>Label</option><option>Pallet</option><option>Tape</option><option>Others</option></select></div>
          <div><label>Lead Time (天)</label><input type="number" id="newLead" value="14"></div>
          <div><label>CBM / pcs</label><input type="number" id="newCbm" step="0.000001" placeholder="0.001"></div>
          <div><label>Monthly Usage</label><input type="number" id="newUsage" value="0"></div>
        </div>
        <button class="btn" id="saveNewMat">儲存新物料</button>
      </div>
      <div class="add-form" id="editMatForm">
        <h3 style="margin-top:0">編輯物料</h3>
        <input type="hidden" id="editId">
        <div class="form-row">
          <div><label>物料#</label><input type="text" id="editIdDisplay" disabled></div>
          <div><label>SAP#</label><input type="text" id="editSap"></div>
          <div><label>Description</label><input type="text" id="editName"></div>
          <div><label>單位</label><input type="text" id="editUm"></div>
          <div><label>供應商</label><input type="text" id="editSupplier"></div>
          <div><label>供應商 Email</label><input type="email" id="editEmail"></div>
          <div><label>類型</label><select id="editType"><option>Carton Box</option><option>Bag</option><option>Label</option><option>Pallet</option><option>Tape</option><option>Others</option></select></div>
          <div><label>Lead Time (天)</label><input type="number" id="editLead"></div>
          <div><label>CBM / pcs</label><input type="number" id="editCbm" step="0.000001"></div>
          <div><label>Monthly Usage</label><input type="number" id="editUsage"></div>
          <div><label>現有庫存</label><input type="number" id="editStock"></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn" id="saveEditMat">儲存修改</button>
          <button class="btn secondary" id="cancelEditMat">取消</button>
        </div>
      </div>
      <div class="filters" id="supplierFilters"></div>
      <div id="materialList"></div>
    </div>
  </div>

  <!-- Count -->
  <div id="tab-count" style="display:none">
    <div class="section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
        <h2 style="margin:0">批量盤點輸入</h2>
        <div class="toolbar">
          <button class="btn secondary" id="exportCountList">匯出盤點清單 (XLSX)</button>
          <button class="btn secondary" id="importCountBtn">導入盤點紀錄 (XLSX)</button>
          <input type="file" id="importCountFile" class="file-input" accept=".xlsx,.xls">
        </div>
      </div>
      <p style="color:var(--muted); margin-top:0">物料已依物料# A→Z 排序。可匯出 XLSX 現場點數後再導入。</p>
      <div id="batchCountTable"></div>
      <div style="margin-top:12px">
        <label>位置（套用到本次所有）</label>
        <input type="text" id="batchLoc" placeholder="例如 1AJ / Warehouse" style="max-width:300px; margin-bottom:10px">
      </div>
      <button class="btn" id="saveBatchCount">儲存本次盤點</button>
    </div>
    <div class="section">
      <h2 style="margin-top:0">歷史盤點</h2>
      <div id="countList"></div>
    </div>
  </div>

  <!-- Inbound -->
  <div id="tab-inbound" style="display:none">
    <div class="section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
        <h2 style="margin:0">新增到倉</h2>
        <div class="toolbar">
          <button class="btn secondary" id="importInboundBtn">導入到倉紀錄 (XLSX)</button>
          <input type="file" id="importInboundFile" class="file-input" accept=".xlsx,.xls">
        </div>
      </div>
      <div class="form-row">
        <div><label>物料#</label><select id="inMat"></select></div>
        <div><label>到倉數量</label><input type="number" id="inQty" min="0"></div>
        <div><label>供應商</label><input type="text" id="inSupplier"></div>
        <div><label>PO#</label><input type="text" id="inPO"></div>
        <div><label>關聯下單（選填）</label><select id="inOrderId"><option value="">無</option></select></div>
      </div>
      <button class="btn success" id="saveInboundBtn">儲存到倉</button>
    </div>
    <div class="section">
      <h2 style="margin-top:0">歷史到倉</h2>
      <div id="inboundList"></div>
    </div>
  </div>

  <!-- Usage -->
  <div id="tab-usage" style="display:none">
    <div class="section">
      <h2 style="margin-top:0">用量計算</h2>
      <div class="formula-box">
        <strong>計算公式：</strong><br>
        期間用量 = 期初庫存 + 期間到貨 − 期末庫存<br>
        Monthly Usage = 期間用量 × 30 ÷ 相隔天數
      </div>
      <div class="form-row">
        <div><label>選擇物料</label><select id="usageMat"></select></div>
        <div><label>區間數量</label>
          <select id="usageIntervals">
            <option value="2">最近 2 個區間</option>
            <option value="3" selected>最近 3 個區間</option>
            <option value="4">最近 4 個區間</option>
          </select>
        </div>
        <div style="align-self:end"><button class="btn warning" id="calcUsageBtn">計算</button></div>
      </div>
      <div id="usageResult"></div>
    </div>
  </div>

  <!-- CBM -->
  <div id="tab-cbm" style="display:none">
    <div class="section">
      <h2 style="margin-top:0">CBM 計算工具</h2>
      <div class="form-row">
        <div><label>選擇物料</label><select id="cbmMat"></select></div>
        <div><label>數量</label><input type="number" id="cbmQty" value="1" min="1"></div>
        <div style="align-self:end"><button class="btn" id="calcCbmBtn">計算 CBM</button></div>
      </div>
      <div id="cbmResult"></div>
    </div>
    <div class="section">
      <h2 style="margin-top:0">現有庫存總 CBM</h2>
      <div id="totalCbmList"></div>
    </div>
  </div>

  <!-- Order -->
  <div id="tab-order" style="display:none">
    <div class="section">
      <h2 style="margin-top:0">建立下單</h2>
      <div class="form-row">
        <div>
          <label>供應商</label>
          <select id="orderSupplier"></select>
        </div>
        <div>
          <label>下單人</label>
          <input type="text" id="orderPerson" placeholder="例如 Alfred Yeung" value="Alfred Yeung">
        </div>
        <div>
          <label>客戶 / Project</label>
          <input type="text" id="orderProject" placeholder="例如 Balluff" value="Balluff">
        </div>
        <div>
          <label>到貨備註（選填）</label>
          <input type="text" id="orderNote" placeholder="例如分2車到、急單等">
        </div>
      </div>
      <div id="orderItemList" style="margin-top:12px"></div>
      <button class="btn" id="generateOrderBtn" style="margin-top:12px">生成 Email</button>
    <div class="section" id="orderResult" style="display:none">
      <h3 style="margin-top:0">Email 草稿</h3>
      <div class="form-row">
        <div style="grid-column:1/-1">
          <label>主旨</label>
          <input type="text" id="emailSubject" readonly>
        </div>
        <div style="grid-column:1/-1">
          <label>收件人</label>
          <input type="text" id="emailTo" readonly>
        </div>
        <div style="grid-column:1/-1">
          <label>內文</label>
          <textarea id="emailBody" rows="10" readonly></textarea>
        </div>
      </div>
      <div class="toolbar">
        <button class="btn secondary" id="copyEmailBtn">複製內文</button>
        <button class="btn" id="mailtoBtn">開啟郵件程式</button>
      </div>
    </div>
    <div class="section">
      <h2 style="margin-top:0">下單紀錄</h2>
      <div id="orderHistory"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

function getSortedMaterials() {
  return [...materials].sort((a, b) => a.id.localeCompare(b.id));

function isGasConfigured() {
  return GAS_URL && !GAS_URL.includes('請貼上你的部署ID');
}

function setSyncBadge(text, state) {
  const el = document.getElementById('syncBadge');
  if (!el) return;
  el.textContent = text;
  el.style.background = state === 'ok' ? '#1a4d2e' : state === 'err' ? '#4d1a1a' : '#333';
  el.style.color = state === 'ok' ? '#6ee7a0' : state === 'err' ? '#f87171' : '#888';
}

async function syncFromCloud(showToast = false) {
  if (!isGasConfigured()) {
    setSyncBadge('尚未設定雲端', 'err');
    return;
  }
  setSyncBadge('同步中...', '');
  try {
    const res = await fetch(GAS_URL, { method: 'GET', cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    materials = Array.isArray(data.materials) ? data.materials : [];
    counts = Array.isArray(data.counts) ? data.counts : [];
    inbounds = Array.isArray(data.inbounds) ? data.inbounds : [];
    orders = Array.isArray(data.orders) ? data.orders.map(parseOrder) : [];
    counts.forEach(c => { if (!c.id) c.id = nextCountId++; });
    inbounds.forEach(i => { if (!i.id) i.id = nextInboundId++; });
    orders.forEach(o => { if (!o.id) o.id = nextOrderId++; });
    recalcDerived();
    setSyncBadge('雲端已同步', 'ok');
    if (showToast) toast('已從 Google Sheets 更新');
  } catch (err) {
    console.error('Sync failed:', err);
    setSyncBadge('雲端連線失敗', 'err');
    if (showToast) toast('讀取雲端失敗');
  }
}

function parseOrder(o) {
  if (typeof o.items === 'string') {
    try { o.items = JSON.parse(o.items); } catch { o.items = []; }
  }
  return o;
}

async function apiPost(payload) {
  if (!isGasConfigured()) throw new Error('尚未設定 GAS_URL');
  setSyncBadge('儲存中...', '');
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const result = await res.json();
  if (result && result.ok === false) throw new Error(result.error || '寫入失敗');
  setSyncBadge('雲端已同步', 'ok');
  return result;
}

async function saveData() {
  try {
    await apiPost({ action: 'saveAll', data: { materials, counts, inbounds, orders } });
  } catch (err) {
    console.error('Save failed:', err);
    setSyncBadge('儲存失敗', 'err');
    toast('雲端儲存失敗');
  }
}

async function loadData() {
  await syncFromCloud(false);
  if (!materials.length && isGasConfigured()) {
    materials = DEFAULT_MATERIALS.map(m => ({...m}));
    counts = SAMPLE_COUNTS.map(c => ({...c}));
    inbounds = SAMPLE_INBOUNDS.map(i => ({...i}));
    orders = [];
    recalcDerived();
    await saveData();
    toast('已初始化預設資料');
  }
}
function recalcDerived() {
  materials.forEach(m => {
    m.max = Math.ceil((m.usage||0) * 1.5);
    m.min = Math.ceil((m.usage||0) * 0.75);
    m.safety = Math.ceil((m.usage||0) * (m.lead||0) / 30 + (m.usage||0) * 0.3);
    if ((m.stock||0) <= m.safety) m.status = "Critical";
    else if ((m.stock||0) <= m.min) m.status = "Low";
    else m.status = "OK";
  });
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
function switchTab(tab) {

  ["dashboard","materials","count","inbound","usage","cbm","order"].forEach(t => {
    document.getElementById("tab-" + t).style.display = t === tab ? "block" : "none";
  });
  // Re-sync from cloud when switching tabs (same as stationery system)
  syncFromCloud(false).then(() => {
    if (tab === "dashboard") renderDashboard();
    if (tab === "materials") renderMaterials();
    if (tab === "count") renderBatchCount();
    if (tab === "inbound") { renderInbounds(); fillOrderSelect(); }

    if (tab === "cbm") renderCbm();
    if (tab === "order") { renderOrder(); renderOrderHistory(); }
  });
}

      const id = +btn.dataset.delIn;
      if (!confirm("確定刪除此筆到倉記錄？")) return;
      const inbound = inbounds.find(x => x.id === id);
      if (inbound) {
        // Reverse stock
        const m = materials.find(x => x.id === inbound.mat);
        if (m) m.stock = Math.max(0, (m.stock||0) - inbound.qty);

        // Reverse order received qty and status
        if (inbound.orderId) {
          const order = orders.find(o => String(o.id) === String(inbound.orderId));
          if (order) {
            const item = order.items.find(i => i.id === inbound.mat);
            if (item) {
              item.received = Math.max(0, (item.received||0) - inbound.qty);
              const allDone = order.items.every(i => (i.received||0) >= i.qty);
              const anyReceived = order.items.some(i => (i.received||0) > 0);
              order.status = allDone ? "已完成" : anyReceived ? "部分到貨" : "待到貨";
            }
          }
        }
      }
      inbounds = inbounds.filter(x => x.id !== id);
      recalcDerived();
      saveData();
      toast("已刪除到倉記錄，庫存與下單狀態已更新");
      renderInbounds();
    };
  });

function importCountsFromFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type: "array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header: 1});
      let imported = 0;
      const today = new Date().toISOString().slice(0,10);
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r || !r[0]) continue;
        const mat = String(r[0]).trim().toUpperCase();
        const qty = parseInt(r[4]);
        const loc = r[5] ? String(r[5]).trim() : "";
        const date = r[6] ? String(r[6]).slice(0,10) : today;
        if (!mat || isNaN(qty) || qty < 0) continue;
        if (!materials.some(m => m.id === mat)) continue;
        counts.push({id: nextCountId++, date, mat, qty, loc});
        const m = materials.find(x => x.id === mat);
        if (m) { m.stock = qty; m.lastDate = date; }
        imported++;
      }
      if (imported === 0) return toast("未找到有效盤點資料（請確認「本次盤點數量」欄有數字）");
      recalcDerived(); saveData();
      toast(`已導入 ${imported} 筆盤點記錄`);
      renderBatchCount();
    } catch (err) {
      toast("導入失敗：" + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function importInboundsFromFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type: "array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header: 1});
      let imported = 0;
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r || !r[0]) continue;
        const date = r[0] ? String(r[0]).slice(0,10) : "";
        const mat = String(r[1] || "").trim().toUpperCase();
        const qty = parseInt(r[2]);
        const supplier = r[3] ? String(r[3]).trim() : "";
        if (!date || !mat || isNaN(qty) || qty <= 0) continue;
        if (!materials.some(m => m.id === mat)) continue;
        inbounds.push({id: nextInboundId++, date, mat, qty, supplier});
        const m = materials.find(x => x.id === mat);
        if (m) m.stock = (m.stock||0) + qty;
        imported++;
      }
      if (imported === 0) return toast("未找到有效到倉資料（欄位：日期, 物料#, 數量, 供應商）");
      recalcDerived(); saveData();
      toast(`已導入 ${imported} 筆到倉記錄`);
      renderInbounds();
    } catch (err) {
      toast("導入失敗：" + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById("saveInboundBtn").onclick = () => {

  inbounds.push({id: nextInboundId++, date: today, mat, qty, supplier, orderId});

  if (m) m.stock = (m.stock||0) + qty;

  // Update related order received qty
  if (orderId) {
    const order = orders.find(o => String(o.id) === orderId);
    if (order) {
      const item = order.items.find(i => i.id === mat);
      if (item) {
        item.received = (item.received || 0) + qty;
        const allDone = order.items.every(i => (i.received||0) >= i.qty);
        const anyReceived = order.items.some(i => (i.received||0) > 0);
        order.status = allDone ? "已完成" : anyReceived ? "部分到貨" : "待到貨";

  document.getElementById("inQty").value = "";

};
document.getElementById("calcUsageBtn").onclick = () => {
  const matId = document.getElementById("usageMat").value;
  const n = parseInt(document.getElementById("usageIntervals").value);
  const matCounts = counts.filter(c => c.mat === matId).sort((a,b) => a.date.localeCompare(b.date));
  const matIn = inbounds.filter(i => i.mat === matId);
  if (matCounts.length < 2) {
    document.getElementById("usageResult").innerHTML = '<div class="empty">此物料盤點記錄不足（至少需要 2 次）</div>';
    return;
  }
  const intervals = [];
  for (let i = Math.max(0, matCounts.length - n - 1); i < matCounts.length - 1; i++) {
    const start = matCounts[i], end = matCounts[i+1];
    const days = Math.round((new Date(end.date) - new Date(start.date)) / 86400000);
    if (days <= 0) continue;
    const inboundQty = matIn.filter(ib => ib.date > start.date && ib.date <= end.date).reduce((s, ib) => s + ib.qty, 0);
    const periodUsage = start.qty + inboundQty - end.qty;
    const monthly = Math.round(periodUsage * 30 / days);
    intervals.push({start: start.date, end: end.date, startQty: start.qty, endQty: end.qty, inbound: inboundQty, period: periodUsage, days, monthly});
  }
  const avg = intervals.length ? Math.round(intervals.reduce((s,x) => s + x.monthly, 0) / intervals.length) : 0;
  document.getElementById("usageResult").innerHTML = `
    <h3>計算結果（${matId}）</h3>
    <table><tr><th>區間</th><th>期初</th><th>期末</th><th>期間到貨</th><th>期間用量</th><th>天數</th><th>Monthly</th></tr>
    ${intervals.map(iv => `<tr><td>${iv.start} → ${iv.end}</td><td>${iv.startQty.toLocaleString()}</td><td>${iv.endQty.toLocaleString()}</td><td>${iv.inbound.toLocaleString()}</td><td>${iv.period.toLocaleString()}</td><td>${iv.days}</td><td><strong>${iv.monthly.toLocaleString()}</strong></td></tr>`).join("")}</table>
    <div style="margin-top:16px;font-size:1.1rem">平均 Monthly Usage：<strong style="color:var(--accent);font-size:1.4rem">${avg.toLocaleString()}</strong></div>
    <button class="btn secondary" id="applyUsageBtn" style="margin-top:12px">套用到物料清單</button>`;
  document.getElementById("applyUsageBtn").onclick = () => {
    const m = materials.find(x => x.id === matId);
    if (m) { m.usage = avg; recalcDerived(); saveData(); toast("已更新 Monthly Usage 為 " + avg); }
  };
};

function importMaterialsFromFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type: "array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header: 1});
      let added = 0, updated = 0;
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r || !r[0]) continue;
        const id = String(r[0]).trim().toUpperCase();
        const name = String(r[2] || "").trim();
        if (!id || !name) continue;
        const mat = {
          id,
          sap: String(r[1] || "").trim(),
          name,
          um: String(r[3] || "pcs").trim(),
          supplier: String(r[4] || "").trim(),
          email: String(r[5] || "").trim(),
          type: String(r[6] || "Others").trim(),
          lead: parseInt(r[7]) || 0,
          cbm: parseFloat(r[8]) || 0,
          usage: parseInt(r[9]) || 0,
          stock: parseInt(r[10]) || 0,
          lastDate: ""
        };
        const exist = materials.find(m => m.id === id);
        if (exist) {
          Object.assign(exist, mat);
          updated++;
        } else {
          materials.push(mat);
          added++;
        }
      }
      if (added + updated === 0) return toast("未找到有效物料資料（請確認第一欄為物料#）");
      recalcDerived();
      saveData();
      toast(`已導入：新增 ${added} 筆，更新 ${updated} 筆`);
      renderMaterials();
    } catch (err) {
      toast("導入失敗：" + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderOrderHistory() {
  const sorted = [...orders].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
  document.getElementById("orderHistory").innerHTML = sorted.length === 0
    ? '<div class="empty">暫無下單紀錄</div>'
    : `<table><tr><th>日期</th><th>供應商</th><th>物料</th><th>下單數量</th><th>已到貨</th><th>狀態</th><th></th></tr>` +
      sorted.map(o => o.items.map(i => `<tr>
        <td>${o.date}</td><td>${o.supplier}</td><td>${i.id}</td>
        <td>${i.qty}</td><td>${i.received||0}</td>
        <td class="${o.status==='已完成'?'status-OK':o.status==='部分到貨'?'status-Low':'status-Critical'}">${o.status}</td>
        <td><button class="btn danger sm" data-del-order="${o.id}">刪除</button></td>
      </tr>`).join("")).join("") + "</table>";
  document.querySelectorAll("[data-del-order]").forEach(btn => {
    btn.onclick = () => {
      if (!requireLogin()) return;
      const id = parseInt(btn.dataset.delOrder);
      if (!confirm("確定刪除此下單紀錄？")) return;
      orders = orders.filter(o => o.id !== id);
      saveData();
      toast("已刪除下單紀錄");
      renderOrderHistory();
    };
  });
}
